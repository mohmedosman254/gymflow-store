name: Validate GYMFLOW API
on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-check.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check api/src/index.js
      - name: Validate D1 schema
        run: python -c "import sqlite3,pathlib; db=sqlite3.connect(':memory:'); db.executescript(pathlib.Path('api/schema.sql').read_text(encoding='utf-8')); print('D1 schema is valid')"
